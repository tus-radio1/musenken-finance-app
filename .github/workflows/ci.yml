name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-not-a-jwt
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-not-a-jwt
          NEXT_TELEMETRY_DISABLED: "1"

  db:
    name: db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Keep auth, storage-api, PostgREST, and postgres-meta: migrations need
      # auth/storage schemas and type generation needs the metadata API.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      - name: Apply all migrations and seed from scratch
        run: supabase db reset --local
      - name: Lint database schema
        run: supabase db lint --local --fail-on error --level error
      - name: Run pgTAP tests
        run: supabase test db --local
      # lib/database.types.ts must be the raw output of the pinned CLI for the
      # migrations in this commit. Regenerate with `npm run db:types` after
      # `supabase db reset --local` whenever a migration changes.
      - name: Check generated types drift
        run: supabase gen types typescript --local > lib/database.types.ts && git diff --stat --exit-code lib/database.types.ts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      - name: Apply all migrations and seed from scratch
        run: supabase db reset --local
      - name: Export local Supabase environment
        shell: bash
        run: |
          # Do not print credentials or enable shell tracing here.
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
